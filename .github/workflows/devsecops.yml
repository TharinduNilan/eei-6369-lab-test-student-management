name: AWS DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-an-secure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-management

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarCloud SAST Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mnv verify sonar:sonar -Dsonar.projectKey=TharinduNilan_eei-6369-lab-test-student-management || true

      - name: Build Container
        run: docker build -t eei-6369-lab-test-student-management:${{github.sha}} .

      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'eei-6369-lab-test-student-management:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: {{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: {{secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: {{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Container Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: 
          docker tag eei-6369-lab-test-student-management:${{ github.sha }} $ECR_REGISTRY/eei-6369-lab-test-student-management:{{ github.sha }}
