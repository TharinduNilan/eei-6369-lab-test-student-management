
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Student Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/students}">
            Student Management
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <h3 class="fw-bold mb-4"
                        th:text="${pageTitle}">Add New Student</h3>

                    <form th:action="${student.id == null}
                              ? @{/students}
                              : @{/students/{id}/update(id=${student.id})}"
                          th:object="${student}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text"
                                   th:field="*{fullName}"
                                   class="form-control"
                                   placeholder="Enter full name"
                                   required>
                            <div class="text-danger small"
                                 th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   placeholder="Enter email"
                                   required>
                            <div class="text-danger small"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text"
                                   th:field="*{phone}"
                                   class="form-control"
                                   placeholder="Enter phone number">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Course</label>
                            <input type="text"
                                   th:field="*{course}"
                                   class="form-control"
                                   placeholder="Enter course name">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-primary">
                                Save Student
                            </button>

                            <a th:href="@{/students}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

</body>
</html>
