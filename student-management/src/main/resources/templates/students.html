
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/students}">
            Student Management
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Students</h2>
            <p class="text-secondary mb-0">
                Manage your student records
            </p>
        </div>

        <a th:href="@{/students/new}" class="btn btn-primary">
            + Add Student
        </a>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <div class="text-secondary">Total Students</div>
            <h2 class="fw-bold mb-0"
                th:text="${#lists.size(students)}">0</h2>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.id}">1</td>
                        <td class="fw-semibold"
                            th:text="${student.fullName}"></td>
                        <td th:text="${student.email}"></td>
                        <td th:text="${student.phone}"></td>
                        <td th:text="${student.course}"></td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/students/{id}/edit(id=${student.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    Edit
                                </a>

                                <form th:action="@{/students/{id}/delete(id=${student.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this student?')">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6" class="text-center text-secondary py-5">
                            No students found. Add your first student.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</main>

</body>
</html>
